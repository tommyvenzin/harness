<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Harness Validator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  font-family:Arial;
  padding:20px;
}

.controls{
  margin-bottom:16px;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

label{
  font-weight:bold;
}

select,input[type="text"],textarea{
  padding:6px 10px;
}

textarea{
  width:100%;
  min-height:140px;
  font-family:Consolas,monospace;
}

table{
  border-collapse:collapse;
  margin-top:20px;
  width:100%;
}

td,th{
  border:1px solid #ccc;
  padding:6px 10px;
  text-align:center;
  vertical-align:middle;
}

.valid{
  background:#2d7ef7;
  color:white;
}

.invalid{
  background:#ff4d4d;
  color:white;
}

.leader{
  outline:3px solid #f59e0b;
  outline-offset:-3px;
}

.info{
  margin:12px 0;
  padding:10px 12px;
  background:#f3f4f6;
  border:1px solid #d1d5db;
}

.small{
  font-size:12px;
  color:#555;
}

.match-pass{
  background:#dcfce7;
  color:#166534;
  font-weight:bold;
}

.match-warning{
  background:#fef9c3;
  color:#92400e;
  font-weight:bold;
}

.match-fail{
  background:#fee2e2;
  color:#b91c1c;
  font-weight:bold;
}

.match-empty{
  background:#f3f4f6;
  color:#666;
}

.summary-table{
  width:auto;
  margin-top:12px;
  margin-bottom:12px;
}

.summary-table td,
.summary-table th{
  min-width:130px;
}
</style>
</head>

<body>

<h2>Harness PDF Reader</h2>

<div class="controls">
  <input type="file" id="pdfUpload">
  <label for="raceType">Race Type:</label>
  <select id="raceType">
    <option value="mobile" selected>Mobile</option>
    <option value="stand">Stand</option>
  </select>
</div>

<div class="controls">
  <label for="websiteUrl">Harness URL:</label>
  <input type="text" id="websiteUrl" size="70" placeholder="Paste Harness race-fields URL here">
  <button id="loadWebsiteBtn">Load Website</button>
</div>

<div class="small">
  If website loading is blocked, open the Harness page, press Ctrl+A then Ctrl+C, paste the page into the box below, then click “Parse Pasted Website Content”.
</div>

<div style="margin-top:8px;">
  <textarea id="websiteSource" placeholder="Optional fallback: paste website HTML or copied page text here"></textarea>
</div>

<div class="controls">
  <button id="parsePastedBtn">Parse Pasted Website Content</button>
</div>

<div id="statusBox" class="info">Upload PDF first. Website comparison is optional.</div>
<div id="winnerSummary"></div>
<div id="result"></div>

<script>
let latestHorses = [];
let latestRaceMeta = {
  raceNumber: "",
  raceTitle: ""
};

let latestWinnerMeta = {
  horse: "",
  mileRate: "",
  grossTime: ""
};

let pdfOfficialMeta = {
  leadTime: "",
  q1: "",
  q2: "",
  q3: "",
  q4: ""
};

let websiteRows = [];
let websiteMeta = {
  raceType: "",
  source: "",
  leadTime: "",
  mileRate: "",
  grossTime: ""
};

document.getElementById("pdfUpload").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = async function () {
    const typedarray = new Uint8Array(this.result);
    const pdf = await pdfjsLib.getDocument(typedarray).promise;
    let tokens = [];

    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();

      content.items.forEach(item => {
        const t = item.str.trim();
        if (t) tokens.push(t);
      });
    }

    parse(tokens);
  };

  reader.readAsArrayBuffer(file);
});

document.getElementById("raceType").addEventListener("change", () => {
  if (latestHorses.length) display(latestHorses);
});

document.getElementById("loadWebsiteBtn").addEventListener("click", async () => {
  const url = document.getElementById("websiteUrl").value.trim();
  if (!url) {
    setStatus("Paste a Harness URL first.");
    return;
  }

  if (!latestHorses.length) {
    setStatus("Upload the PDF first so the website parser knows which race to look for.");
    return;
  }

  setStatus("Loading website...");

  try {
    const html = await fetchWebsiteContent(url);
    document.getElementById("websiteSource").value = html;
    parseWebsiteSource(html, "url");
  } catch (err) {
    setStatus("Website load failed. Paste the website HTML/text into the big box below and click 'Parse Pasted Website Content'.");
  }
});

document.getElementById("parsePastedBtn").addEventListener("click", () => {
  const source = document.getElementById("websiteSource").value.trim();
  if (!source) {
    setStatus("Paste website HTML or copied page text first.");
    return;
  }
  parseWebsiteSource(source, "paste");
});

function setStatus(text) {
  document.getElementById("statusBox").textContent = text;
}

function normalizeHorseName(name) {
  return String(name || "")
    .toUpperCase()
    .replace(/\((NZ|AUS|USA|GB|IRE|FR)\)/g, "")
    .replace(/\b(NZ|AUS|USA|GB|IRE|FR)\b$/g, "")
    .replace(/[^\w\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeDriverName(name) {
  return String(name || "")
    .toUpperCase()
    .replace(/\s+/g, " ")
    .replace(/[^\w\s'.-]/g, "")
    .trim();
}

function namesMatch(a, b) {
  return normalizeHorseName(a) === normalizeHorseName(b);
}

function driversMatch(a, b) {
  return normalizeDriverName(a) === normalizeDriverName(b);
}

function isExactHorseMatch(a, b) {
  const aa = String(a || "")
    .toUpperCase()
    .replace(/[^\w\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();

  const bb = String(b || "")
    .toUpperCase()
    .replace(/[^\w\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();

  return aa === bb;
}

function getHorseCellClass(pdfHorse, webHorse) {
  if (!webHorse) return "match-empty";
  if (isExactHorseMatch(pdfHorse, webHorse)) return "match-pass";
  if (namesMatch(pdfHorse, webHorse)) return "match-warning";
  return "match-fail";
}

function getDriverCellClass(pdfDriver, webDriver) {
  if (!webDriver) return "match-empty";
  return driversMatch(pdfDriver, webDriver) ? "match-pass" : "match-fail";
}

function normalizeRaceClock(str) {
  if (!str) return "";
  let s = String(str).trim();

  const m1 = s.match(/^(\d+):(\d{2})[:.](\d{1,2})$/);
  if (m1) return `${m1[1]}:${m1[2]}.${m1[3]}`;

  const m2 = s.match(/^(\d+):(\d{2}\.\d{1,2})$/);
  if (m2) return s;

  return s;
}

function raceClockToSeconds(str) {
  const normalized = normalizeRaceClock(str);
  if (!normalized) return NaN;

  const match = normalized.match(/^(\d+):(\d{2})(?:\.(\d{1,2}))?$/);
  if (!match) return NaN;

  const mins = parseInt(match[1], 10);
  const secs = parseInt(match[2], 10);
  const frac = match[3] ? parseInt(match[3], 10) / Math.pow(10, match[3].length) : 0;

  return mins * 60 + secs + frac;
}

function isHorseStart(tokens, i) {
  if (!tokens[i] || !tokens[i + 1] || !tokens[i + 2] || !tokens[i + 3]) return false;
  if (!/^\d+$/.test(tokens[i])) return false;
  if (!/^\d+$/.test(tokens[i + 1])) return false;

  const horse = tokens[i + 2];
  const speed = tokens[i + 3];

  if (horse === "Horse/" || horse === "Driver") return false;
  if (!/^\d+\.\d+$/.test(speed)) return false;

  const rank = parseInt(tokens[i], 10);
  const tab = parseInt(tokens[i + 1], 10);

  return rank >= 1 && rank <= 30 && tab >= 1 && tab <= 30;
}

function parseTimeToSeconds(token) {
  if (!token) return "";

  let cleaned = String(token).replace(/\[\d+\]/g, "").trim();
  cleaned = cleaned.replace(/^\(/, "").replace(/\)$/, "");

  const match = cleaned.match(/^(\d+):(\d{2}(?:\.\d+)?)$/);
  if (!match) return "";

  return +(parseInt(match[1], 10) * 60 + parseFloat(match[2])).toFixed(2);
}

function isBracketQuarter(token) {
  return /^\(\d+:\d{2}\.\d+\)$/.test(String(token || "").trim());
}

function isRankedClock(token) {
  return /^\d+:\d{2}\.\d+\s*\[\d+\]$/.test(String(token || "").trim());
}

function isPlainClock(token) {
  return /^\d+:\d{2}\.\d+$/.test(String(token || "").trim());
}

function parseMeters(token) {
  const m = String(token || "").match(/^(\d+)m$/);
  return m ? parseInt(m[1], 10) : "";
}

function extractFirst50(block) {
  const decimalTokens = [];

  for (let i = 3; i < Math.min(block.length, 18); i++) {
    const t = (block[i] || "").trim();
    if (/^\d{2}\.\d{2}$/.test(t)) {
      decimalTokens.push(parseFloat(t));
    }
  }

  return decimalTokens[1] ?? "";
}

function findDriver(block, horse) {
  for (let i = 0; i < block.length; i++) {
    const t = String(block[i] || "").trim();

    if (!t || t === horse) continue;
    if (t.includes("Tabcorp") || t.includes("Race") || t.includes("Professional")) continue;

    if (/^[A-Z][a-z]+(?:\s+[A-Za-z.'-]+)+$/.test(t)) {
      return t;
    }
  }
  return "";
}

function extractPdfOfficialMeta(tokens, firstHorseStartIndex) {
  const headerTokens = tokens.slice(0, Math.max(0, firstHorseStartIndex));
  const joined = headerTokens.join(" ");

  const leadMatch = joined.match(/Lead\s+Time\s+(\d+:\d{2}\.\d+)/i);
  const q1Match = joined.match(/1st\s+Quarter\s+(\d+:\d{2}\.\d+)/i);
  const q2Match = joined.match(/2nd\s+Quarter\s+(\d+:\d{2}\.\d+)/i);
  const q3Match = joined.match(/3rd\s+Quarter\s+(\d+:\d{2}\.\d+)/i);
  const q4Match = joined.match(/4th\s+Quarter\s+(\d+:\d{2}\.\d+)/i);

  pdfOfficialMeta = {
    leadTime: leadMatch ? normalizeRaceClock(leadMatch[1]) : "",
    q1: q1Match ? normalizeRaceClock(q1Match[1]) : "",
    q2: q2Match ? normalizeRaceClock(q2Match[1]) : "",
    q3: q3Match ? normalizeRaceClock(q3Match[1]) : "",
    q4: q4Match ? normalizeRaceClock(q4Match[1]) : ""
  };
}

function extractHorseData(block) {
  const horse = block[2] || "";
  const driver = findDriver(block, horse);

  const bracketTimes = block
    .filter(isBracketQuarter)
    .map(t => parseTimeToSeconds(t));

  const allMeters = block
    .map(parseMeters)
    .filter(v => v !== "");

  const rowClocksRaw = block.filter(t => isPlainClock(t) || isRankedClock(t));
  const rowClocks = rowClocksRaw.map(t =>
    normalizeRaceClock(String(t).replace(/\s*\[\d+\]\s*$/, ""))
  );

  const leadTimeClock = rowClocks.find((t, idx) => {
    const raw = rowClocksRaw[idx] || "";
    return /\[\d+\]/.test(String(raw));
  }) || "";

  const mileRate = rowClocks[rowClocks.length - 2] || "";
  const grossTime = rowClocks[rowClocks.length - 1] || "";

  return {
    driver,
    q1: bracketTimes[0] ?? "",
    q2: bracketTimes[1] ?? "",
    q3: bracketTimes[2] ?? "",
    q4: bracketTimes[3] ?? "",
    first200: allMeters[0] ?? "",
    firstHalf: allMeters[1] ?? "",
    middleHalf: allMeters[2] ?? "",
    lastHalf: allMeters[3] ?? "",
    leadDist: allMeters[4] ?? "",
    q1Dist: allMeters[5] ?? "",
    q2Dist: allMeters[6] ?? "",
    q3Dist: allMeters[7] ?? "",
    q4Dist: allMeters[8] ?? "",
    lastMile: allMeters[9] ?? "",
    leadTimeClock,
    mileRate,
    grossTime
  };
}

function markLeaders(horses) {
  const validFirst50s = horses.map(h => Number(h.first50)).filter(v => !isNaN(v) && v > 0);

  if (!validFirst50s.length) {
    horses.forEach(h => h.isLeader = false);
    return;
  }

  const minFirst50 = Math.min(...validFirst50s);
  horses.forEach(h => {
    h.isLeader = Number(h.first50) === minFirst50;
  });
}

function validateLeaderFirst50(first50, isLeader, raceType) {
  if (!isLeader) return "";

  const value = Number(first50);
  if (isNaN(value)) return false;

  return raceType === "stand"
    ? (value >= 5 && value <= 6)
    : (value >= 3.2 && value <= 4.5);
}

function parse(tokens) {
  const starts = [];

  for (let i = 0; i < tokens.length; i++) {
    if (isHorseStart(tokens, i)) {
      starts.push(i);
    }
  }

  const fullText = tokens.join(" ");
  const raceMatch = fullText.match(/Race\s+(\d+):\s+(.+?)\s+-\s+\d{3,4}m/i);

  latestRaceMeta = {
    raceNumber: raceMatch ? raceMatch[1] : "",
    raceTitle: raceMatch ? raceMatch[2].trim() : ""
  };

  latestWinnerMeta = {
    horse: "",
    mileRate: "",
    grossTime: ""
  };

  extractPdfOfficialMeta(tokens, starts[0] ?? tokens.length);

  const horses = [];

  for (let s = 0; s < starts.length; s++) {
    const start = starts[s];
    const end = (s < starts.length - 1) ? starts[s + 1] : tokens.length;

    let block = tokens.slice(start, end);

    const stopWords = ["Scratched:", "Tabcorp", "Race", "Data", "Note:", "[", "-:--.--", "N/A"];
    let clean = [];

    for (let i = 0; i < block.length; i++) {
      if (stopWords.includes(block[i])) break;
      clean.push(block[i]);
    }

    block = clean;

    const rank = parseInt(block[0], 10);
    const tab = parseInt(block[1], 10);
    const horse = block[2] || "";
    const topSpeed = parseFloat(block[3]) || "";
    const first50 = extractFirst50(block);

    const parsed = extractHorseData(block);

    if (rank === 1) {
      latestWinnerMeta = {
        horse,
        mileRate: parsed.mileRate,
        grossTime: parsed.grossTime
      };
    }

    horses.push({
      rank,
      tab,
      horse,
      driver: parsed.driver,
      topSpeed,
      first50,
      first200: parsed.first200,
      firstHalf: parsed.firstHalf,
      middleHalf: parsed.middleHalf,
      lastHalf: parsed.lastHalf,
      leadDist: parsed.leadDist,
      q1Dist: parsed.q1Dist,
      q2Dist: parsed.q2Dist,
      q3Dist: parsed.q3Dist,
      q4Dist: parsed.q4Dist,
      lastMile: parsed.lastMile,
      q1: parsed.q1,
      q2: parsed.q2,
      q3: parsed.q3,
      q4: parsed.q4,
      leadTime: parsed.leadTimeClock ? parseTimeToSeconds(parsed.leadTimeClock) : "",
      leadClock: parsed.leadTimeClock,
      isLeader: false
    });
  }

  markLeaders(horses);

  websiteRows = [];
  websiteMeta = {
    raceType: "",
    source: "",
    leadTime: "",
    mileRate: "",
    grossTime: ""
  };

  latestHorses = horses;
  display(horses);

  let msg = "PDF loaded";
  if (latestRaceMeta.raceNumber) msg += " | Race " + latestRaceMeta.raceNumber;
  if (latestRaceMeta.raceTitle) msg += " | " + latestRaceMeta.raceTitle;
  if (pdfOfficialMeta.leadTime) msg += " | PDF Official Lead Time " + pdfOfficialMeta.leadTime;
  msg += " | Website data reset for this PDF";
  setStatus(msg);
}

async function fetchWebsiteContent(url) {
  const attempts = [url];
  const mcMatch = url.match(/[?&]mc=([^&]+)/i);

  if (mcMatch) {
    attempts.push("https://legacy.harness.org.au/fields.cfm?mc=" + mcMatch[1]);
    attempts.push("https://legacy.harness.org.au/fieldsprt.cfm?mc=" + mcMatch[1]);
  }

  const uniqueAttempts = [...new Set(attempts)];

  for (const attemptUrl of uniqueAttempts) {
    try {
      const res = await fetch(attemptUrl);
      const txt = await res.text();
      if (txt && txt.length > 500) return txt;
    } catch (err) {}

    try {
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(attemptUrl);
      const res = await fetch(proxyUrl);
      const txt = await res.text();
      if (txt && txt.length > 500) return txt;
    } catch (err) {}
  }

  throw new Error("Website fetch failed");
}

function findWebsiteHorse(pdfHorse) {
  const target = normalizeHorseName(pdfHorse);
  return websiteRows.find(w => normalizeHorseName(w.horse) === target) || null;
}

function getDirectText(el) {
  if (!el) return "";
  return Array.from(el.childNodes)
    .filter(node => node.nodeType === Node.TEXT_NODE)
    .map(node => node.textContent)
    .join(" ")
    .replace(/\s+/g, " ")
    .trim();
}

function getRaceBlocksFromHtml(doc) {
  return Array.from(doc.querySelectorAll("div.forPrint"));
}

function findRaceBlockByRaceNumber(doc, raceNumber) {
  const blocks = getRaceBlocksFromHtml(doc);
  const target = String(raceNumber || "").trim();

  for (const block of blocks) {
    const numCell = block.querySelector("td.raceNumber");
    if (!numCell) continue;

    const num = (numCell.textContent || "").replace(/\s+/g, " ").trim();
    if (num === target) return block;
  }

  return null;
}

function extractWebsiteRaceTypeFromBlock(block) {
  const info = block.querySelector("td.raceInformation");
  const text = info ? info.textContent.replace(/\s+/g, " ").trim() : "";

  if (/stand/i.test(text)) return "stand";
  if (/mobile/i.test(text)) return "mobile";
  return "";
}

function extractWebsiteRaceTimesFromBlock(block) {
  const out = {
    leadTime: "",
    mileRate: "",
    grossTime: ""
  };

  const table = block.querySelector("table.raceTimes");
  if (!table) return out;

  const tds = Array.from(table.querySelectorAll("td"));

  for (const td of tds) {
    const strong = td.querySelector("strong");
    if (!strong) continue;

    const label = strong.textContent.replace(/\s+/g, " ").trim().toLowerCase();
    const raw = getDirectText(td);

    if (label.includes("lead time")) out.leadTime = raw;
    else if (label.includes("mile rate")) out.mileRate = raw;
    else if (label.includes("gross time")) out.grossTime = raw;
  }

  return out;
}

function extractWebsiteRowsFromBlock(block) {
  const rows = [];
  const table = block.querySelector("table.raceFieldTable.resultTable");
  if (!table) return rows;

  const trList = Array.from(table.querySelectorAll("tr"));

  for (const tr of trList) {
    const cells = Array.from(tr.querySelectorAll("td"));
    if (!cells.length) continue;

    const firstCellText = (cells[0].textContent || "").replace(/\s+/g, " ").trim();
    if (!/^\d+$/.test(firstCellText)) continue;

    const horseNumberCells = Array.from(tr.querySelectorAll("td.horse_number"));
    const horseAnchor = tr.querySelector("td.horse_name a.horse_name_link");
    const driverAnchor = tr.querySelector("td.driver a");

    if (horseNumberCells.length < 2) continue;
    if (!horseAnchor || !driverAnchor) continue;

    const placing = (horseNumberCells[0].textContent || "").replace(/\s+/g, " ").trim();
    const tab = (horseNumberCells[1].textContent || "").replace(/\s+/g, " ").trim();
    const horse = (horseAnchor.textContent || "").replace(/\s+/g, " ").trim();
    const driver = (driverAnchor.textContent || "").replace(/\s+/g, " ").trim();

    rows.push({
      rank: placing,
      tab,
      horse,
      driver
    });
  }

  return rows;
}

function parseWebsiteSource(source, sourceType) {
  const raw = String(source || "").trim();
  if (!raw) {
    setStatus("Paste website HTML or copied page text first.");
    return;
  }

  websiteRows = [];
  websiteMeta = {
    raceType: "",
    source: sourceType,
    leadTime: "",
    mileRate: "",
    grossTime: ""
  };

  const parser = new DOMParser();
  const doc = parser.parseFromString(raw, "text/html");

  const raceBlock = findRaceBlockByRaceNumber(doc, latestRaceMeta.raceNumber);

  if (!raceBlock) {
    setStatus("Could not find matching race block for Race " + (latestRaceMeta.raceNumber || "?") + " in pasted Harness HTML.");
    if (latestHorses.length) display(latestHorses);
    return;
  }

  websiteMeta.raceType = extractWebsiteRaceTypeFromBlock(raceBlock);
  if (websiteMeta.raceType) {
    document.getElementById("raceType").value = websiteMeta.raceType;
  }

  const raceTimes = extractWebsiteRaceTimesFromBlock(raceBlock);
  websiteMeta.leadTime = raceTimes.leadTime;
  websiteMeta.mileRate = raceTimes.mileRate;
  websiteMeta.grossTime = raceTimes.grossTime;

  websiteRows = extractWebsiteRowsFromBlock(raceBlock);

  if (latestHorses.length) {
    display(latestHorses);
  }

  setStatus(
    "Website parsed: " + websiteRows.length + " runner(s) found" +
    (websiteMeta.raceType ? " | Race type auto-set to " + websiteMeta.raceType : "") +
    (websiteMeta.leadTime ? " | Lead Time " + websiteMeta.leadTime : "") +
    (websiteMeta.mileRate ? " | Mile Rate " + websiteMeta.mileRate : "") +
    (websiteMeta.grossTime ? " | Gross Time " + websiteMeta.grossTime : "")
  );
}

function renderWinnerSummary() {
  const winnerDiv = document.getElementById("winnerSummary");

  if (!latestWinnerMeta.horse) {
    winnerDiv.innerHTML = "";
    return;
  }

  const pdfLeadTime = pdfOfficialMeta.leadTime || "";
  const pdfMile = latestWinnerMeta.mileRate || "";
  const pdfGross = latestWinnerMeta.grossTime || "";

  const webLead = websiteMeta.leadTime || "";
  const webMile = websiteMeta.mileRate || "";
  const webGross = websiteMeta.grossTime || "";

  let html = "";
  html += "<table class='summary-table'>";
  html += "<tr>";
  html += "<th>Winner</th>";
  html += "<th>PDF Mile Rate</th>";
  html += "<th>Web Mile Rate</th>";
  html += "<th>PDF Gross Time</th>";
  html += "<th>Web Gross Time</th>";
  html += "<th>PDF Lead Time</th>";
  html += "<th>Web Lead Time</th>";
  html += "</tr>";
  html += "<tr>";
  html += `<td>${latestWinnerMeta.horse}</td>`;
  html += `<td class="${pdfMile ? "valid" : "match-empty"}">${pdfMile || "-"}</td>`;
  html += `<td class="${webMile ? "match-pass" : "match-empty"}">${webMile || "-"}</td>`;
  html += `<td class="${pdfGross ? "valid" : "match-empty"}">${pdfGross || "-"}</td>`;
  html += `<td class="${webGross ? "match-pass" : "match-empty"}">${webGross || "-"}</td>`;
  html += `<td class="${pdfLeadTime ? "valid" : "match-empty"}">${pdfLeadTime || "-"}</td>`;
  html += `<td class="${webLead ? "match-pass" : "match-empty"}">${webLead || "-"}</td>`;
  html += "</tr>";
  html += "</table>";

  winnerDiv.innerHTML = html;
}

function display(horses) {
  const raceType = document.getElementById("raceType").value;

  renderWinnerSummary();

  let html = "<table>";

  html += "<tr>";
  html += "<th>Rank</th>";
  html += "<th>Web Rank</th>";
  html += "<th>Horse</th>";
  html += "<th>Web Horse</th>";
  html += "<th>TAB</th>";
  html += "<th>Web TAB</th>";
  html += "<th>Driver</th>";
  html += "<th>Web Driver</th>";
  html += "<th>Speed</th>";
  html += "<th>1st 50m</th>";
  html += "<th>Leader 50m Rule</th>";
  html += "<th>Mile</th>";
  html += "<th>200m</th>";
  html += "<th>1st Half</th>";
  html += "<th>Mid Half</th>";
  html += "<th>Last Half</th>";
  html += "<th>Lead Time</th>";
  html += "<th>Q1</th>";
  html += "<th>Q2</th>";
  html += "<th>Q3</th>";
  html += "<th>Q4</th>";
  html += "</tr>";

  horses.forEach(h => {
    const webHorse = findWebsiteHorse(h.horse);
    const webRank = webHorse ? webHorse.rank : "";
    const webTab = webHorse ? webHorse.tab : "";
    const webHorseName = webHorse ? webHorse.horse : "";
    const webDriverName = webHorse ? webHorse.driver : "";

    const webRankClass = !webRank ? "match-empty" : (String(h.rank) === String(webRank) ? "match-pass" : "match-fail");
    const webTabClass = !webTab ? "match-empty" : (String(h.tab) === String(webTab) ? "match-pass" : "match-fail");
    const webHorseClass = getHorseCellClass(h.horse, webHorseName);
    const webDriverClass = getDriverCellClass(h.driver, webDriverName);

    const speedClass = h.topSpeed < 61.5 ? "valid" : "invalid";
    const mileClass = h.lastMile > 1609 ? "valid" : "invalid";
    const d200Class = (h.first200 >= 195 && h.first200 <= 205) ? "valid" : "invalid";

    const fhClass = h.firstHalf > 804 ? "valid" : "invalid";
    const mhClass = h.middleHalf > 804 ? "valid" : "invalid";
    const lhClass = h.lastHalf > 804 ? "valid" : "invalid";

    const q1Class = h.q1 > 25.5 ? "valid" : "invalid";
    const q2Class = h.q2 > 25.5 ? "valid" : "invalid";
    const q3Class = h.q3 > 25.5 ? "valid" : "invalid";
    const q4Class = h.q4 > 25.5 ? "valid" : "invalid";

    const leadClass = h.leadTime === ""
      ? "match-empty"
      : (h.leadTime <= 70 ? "valid" : "invalid");

    const first50Valid = validateLeaderFirst50(h.first50, h.isLeader, raceType);
    const first50RuleClass = h.isLeader
      ? (first50Valid ? "valid" : "invalid")
      : "";

    const first50CellClass = h.isLeader ? "leader" : "";

    html += "<tr>";
    html += `<td>${h.rank}</td>`;
    html += `<td class="${webRankClass}">${webRank || "-"}</td>`;
    html += `<td>${h.horse}</td>`;
    html += `<td class="${webHorseClass}">${webHorseName || "-"}</td>`;
    html += `<td>${h.tab}</td>`;
    html += `<td class="${webTabClass}">${webTab || "-"}</td>`;
    html += `<td>${h.driver}</td>`;
    html += `<td class="${webDriverClass}">${webDriverName || "-"}</td>`;
    html += `<td class="${speedClass}">${h.topSpeed}</td>`;
    html += `<td class="${first50CellClass}">${h.first50}</td>`;
    html += `<td class="${first50RuleClass}">${h.isLeader ? (first50Valid ? "PASS" : "FAIL") : "-"}</td>`;
    html += `<td class="${mileClass}">${h.lastMile}</td>`;
    html += `<td class="${d200Class}">${h.first200}</td>`;
    html += `<td class="${fhClass}">${h.firstHalf}</td>`;
    html += `<td class="${mhClass}">${h.middleHalf}</td>`;
    html += `<td class="${lhClass}">${h.lastHalf}</td>`;
    html += `<td class="${leadClass}">${h.leadClock || "-"}</td>`;
    html += `<td class="${q1Class}">${h.q1}</td>`;
    html += `<td class="${q2Class}">${h.q2}</td>`;
    html += `<td class="${q3Class}">${h.q3}</td>`;
    html += `<td class="${q4Class}">${h.q4}</td>`;
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
